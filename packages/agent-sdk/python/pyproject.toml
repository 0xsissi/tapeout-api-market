[project]
name = "clawmarket-agent-sdk"
version = "0.1.0"
description = "Python SDK for Tapeout API Market (TAM) Hosted Gateway"
requires-python = ">=3.10"
dependencies = [
  "eth-account>=0.13.0",
  "httpx>=0.27.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["clawmarket_agent_sdk"]
