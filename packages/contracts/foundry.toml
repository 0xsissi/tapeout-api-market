[profile.default]
src = "src"
out = "out"
libs = ["lib"]
remappings = ["@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/"]
solc = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200

[profile.default.rpc_endpoints]
base_sepolia = "https://sepolia.base.org"
bsc_testnet = "https://bsc-testnet-dataseed.bnbchain.org"
